name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-speechinsight2-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy SpeechInsight2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout (record expected SHA)
        uses: actions/checkout@v4

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          EXPECTED_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: EXPECTED_SHA
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail

            APP_DIR=/opt/apps/SpeechInsight2
            # Must match docker-compose.yml container_name and NPM Forward Hostname.
            CONTAINER_NAME=speechinsight-api
            EXPECTED_SHA="${EXPECTED_SHA:?EXPECTED_SHA not set}"

            git config --global --add safe.directory "${APP_DIR}"
            cd "${APP_DIR}"

            echo "========== STAGE 1: preflight =========="
            echo "Deploy user: $(whoami) uid=$(id -u) gid=$(id -g)"
            echo "EXPECTED_SHA (GitHub Actions github.sha)=${EXPECTED_SHA}"
            echo "CONTAINER_NAME=${CONTAINER_NAME}"
            ls -ld "${APP_DIR}" "${APP_DIR}/.git" || true

            if [ ! -w "${APP_DIR}/.git" ]; then
              echo "ERROR: $(whoami) cannot write to ${APP_DIR}/.git"
              echo "On the VPS, run: sudo chown -R $(whoami):$(whoami) ${APP_DIR}"
              exit 1
            fi

            echo "========== STAGE 2: git update =========="
            BEFORE_SHA="$(git rev-parse HEAD 2>/dev/null || echo 'none')"
            echo "BEFORE_SHA=${BEFORE_SHA}"

            git fetch origin
            git reset --hard origin/main

            AFTER_SHA="$(git rev-parse HEAD)"
            echo "AFTER_SHA=${AFTER_SHA}"
            echo "origin/main=$(git rev-parse origin/main)"

            if [ "${AFTER_SHA}" != "${EXPECTED_SHA}" ]; then
              echo "ERROR: VPS HEAD (${AFTER_SHA}) != GitHub Actions SHA (${EXPECTED_SHA})"
              echo "Remote may be behind, or reset targeted the wrong ref."
              git log -3 --oneline
              exit 1
            fi
            if [ "${AFTER_SHA}" != "$(git rev-parse origin/main)" ]; then
              echo "ERROR: HEAD does not match origin/main after reset --hard"
              exit 1
            fi
            echo "OK: working tree is at ${AFTER_SHA}"

            echo "========== STAGE 3: preserve NPM docker networks =========="
            # NPM reaches the app via Docker DNS name speechinsight-api on a shared
            # network. Capture those networks before we recreate the container.
            NPM_NETWORKS=""
            if docker inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
              NPM_NETWORKS="$(docker inspect "${CONTAINER_NAME}" --format '{{range $k, $v := .NetworkSettings.Networks}}{{println $k}}{{end}}' | sed '/^$/d' || true)"
              echo "Networks currently attached to ${CONTAINER_NAME}:"
              printf '%s\n' "${NPM_NETWORKS:-"(none)"}"
            else
              echo "No existing ${CONTAINER_NAME} container; will attach to common NPM networks if present."
            fi

            echo "========== STAGE 4: docker build =========="
            export GIT_SHA="${AFTER_SHA}"
            IMAGE_BEFORE_ID="$(docker images -q speechinsight2:latest 2>/dev/null || true)"
            echo "IMAGE_BEFORE_ID=${IMAGE_BEFORE_ID:-none}"

            # Tear down current stack AND orphans (e.g. old container_name speechinsight2).
            docker compose down --remove-orphans || true

            # Remove any leftover SpeechInsight containers that are not the authoritative name.
            leftover="$(docker ps -a --format '{{.Names}}\t{{.Image}}\t{{.Status}}' | grep -iE 'speechinsight' | grep -v "^${CONTAINER_NAME}[[:space:]]" || true)"
            if [ -n "${leftover}" ]; then
              echo "WARNING: leftover speechinsight containers after compose down --remove-orphans:"
              echo "${leftover}"
              echo "Force-removing leftovers (keeping only ${CONTAINER_NAME} if present)..."
              echo "${leftover}" | awk '{print $1}' | while read -r name; do
                [ -n "${name}" ] || continue
                docker rm -f "${name}" || true
              done
            fi

            # If an old speechinsight-api still exists (stopped/orphan), remove it so
            # compose can recreate with the same container_name from the new image.
            if docker inspect "${CONTAINER_NAME}" >/dev/null 2>&1; then
              echo "Removing existing ${CONTAINER_NAME} so compose can recreate it..."
              docker rm -f "${CONTAINER_NAME}" || true
            fi

            docker compose build --pull --build-arg GIT_SHA="${GIT_SHA}"

            IMAGE_AFTER_ID="$(docker images -q --no-trunc speechinsight2:latest | head -1)"
            echo "IMAGE_AFTER_ID=${IMAGE_AFTER_ID:-none}"
            if [ -z "${IMAGE_AFTER_ID}" ]; then
              echo "ERROR: speechinsight2:latest was not produced by docker compose build"
              exit 1
            fi

            IMAGE_LABEL_SHA="$(docker image inspect speechinsight2:latest --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' 2>/dev/null || true)"
            echo "IMAGE_LABEL_SHA=${IMAGE_LABEL_SHA:-missing}"
            if [ "${IMAGE_LABEL_SHA}" != "${EXPECTED_SHA}" ]; then
              echo "ERROR: image label org.opencontainers.image.revision (${IMAGE_LABEL_SHA}) != ${EXPECTED_SHA}"
              exit 1
            fi
            echo "OK: image rebuilt/labeled for ${EXPECTED_SHA}"

            echo "========== STAGE 5: recreate container =========="
            docker compose up -d --force-recreate --remove-orphans

            CREATED="$(docker inspect -f '{{.Created}}' "${CONTAINER_NAME}")"
            RUNNING_IMAGE_ID="$(docker inspect -f '{{.Image}}' "${CONTAINER_NAME}")"
            echo "CONTAINER_CREATED=${CREATED}"
            echo "CONTAINER_IMAGE_ID=${RUNNING_IMAGE_ID}"

            if [ "${RUNNING_IMAGE_ID}" != "${IMAGE_AFTER_ID}" ]; then
              echo "ERROR: running container image ID != freshly built speechinsight2:latest"
              echo "  container=${RUNNING_IMAGE_ID}"
              echo "  latest=${IMAGE_AFTER_ID}"
              exit 1
            fi

            echo "========== STAGE 6: re-attach NPM networks =========="
            # Reconnect to every network the previous speechinsight-api used, plus
            # common Nginx Proxy Manager network names if they exist.
            attach_net() {
              net="$1"
              [ -n "${net}" ] || return 0
              if ! docker network inspect "${net}" >/dev/null 2>&1; then
                echo "Skip missing network: ${net}"
                return 0
              fi
              if docker inspect "${CONTAINER_NAME}" --format '{{json .NetworkSettings.Networks}}' | grep -q "\"${net}\""; then
                echo "Already on network: ${net}"
                return 0
              fi
              echo "Connecting ${CONTAINER_NAME} to network: ${net}"
              docker network connect "${net}" "${CONTAINER_NAME}" || true
            }

            # Use process substitution (not an unindented heredoc) so this stays valid YAML.
            while IFS= read -r net; do
              attach_net "${net}"
            done < <(printf '%s\n' "${NPM_NETWORKS}")

            # Fallbacks if we had no prior container / empty network list.
            for guess in nginxproxymanager_default npm_default proxy network; do
              attach_net "${guess}"
            done

            extras="$(docker ps --format '{{.Names}}' | grep -iE 'speechinsight' | grep -vx "${CONTAINER_NAME}" || true)"
            if [ -n "${extras}" ]; then
              echo "ERROR: unexpected extra speechinsight containers still running:"
              echo "${extras}"
              docker ps --filter name=speechinsight
              exit 1
            fi
            echo "OK: only ${CONTAINER_NAME} is running"

            echo "========== STAGE 7: health + commit proof =========="
            healthy=0
            health_body=""
            for i in $(seq 1 30); do
              if health_body="$(curl -fsS "http://127.0.0.1:8080/api/health")"; then
                echo "Health HTTP OK on attempt ${i}: ${health_body}"
                healthy=1
                break
              fi
              echo "Attempt ${i}/30: not healthy yet, retrying in 2s..."
              sleep 2
            done

            if [ "${healthy}" -ne 1 ]; then
              echo "ERROR: /api/health did not become healthy in time"
              docker compose ps
              docker compose logs --tail=100 || true
              exit 1
            fi

            served_sha="$(printf '%s' "${health_body}" | sed -n 's/.*"gitSha"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')"
            echo "HEALTH_GIT_SHA=${served_sha}"
            if [ "${served_sha}" != "${EXPECTED_SHA}" ]; then
              echo "ERROR: /api/health gitSha (${served_sha}) != expected (${EXPECTED_SHA})"
              echo "Host :8080 is not serving the commit we just built."
              docker compose ps
              docker ps --filter name=speechinsight
              exit 1
            fi

            # Also prove the NPM Docker DNS name resolves to this same container when possible.
            echo "========== STAGE 8: inventory =========="
            echo "--- git ---"
            git rev-parse HEAD
            echo "--- compose ps ---"
            docker compose ps
            echo "--- docker ps (speechinsight*) ---"
            docker ps -a --filter name=speechinsight --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}\t{{.Ports}}'
            echo "--- networks on ${CONTAINER_NAME} ---"
            docker inspect "${CONTAINER_NAME}" --format '{{range $k, $v := .NetworkSettings.Networks}}{{println $k}}{{end}}'
            echo "--- images ---"
            docker images 'speechinsight2*' --format 'table {{.Repository}}\t{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}'
            echo "--- inspect ${CONTAINER_NAME} ---"
            docker inspect "${CONTAINER_NAME}" --format 'Name={{.Name}} Image={{.Config.Image}} ID={{.Image}} Created={{.Created}} GitLabel={{index .Config.Labels "org.opencontainers.image.revision"}}' 
            echo "--- recent logs ---"
            docker logs --tail=50 "${CONTAINER_NAME}" || true

            docker image prune -f

            echo "========== DEPLOY OK =========="
            echo "GitHub SHA     : ${EXPECTED_SHA}"
            echo "VPS git HEAD   : $(git rev-parse HEAD)"
            echo "Image label    : ${IMAGE_LABEL_SHA}"
            echo "Health gitSha  : ${served_sha}"
            echo "Container      : ${CONTAINER_NAME} @ ${CREATED}"
            echo ""
            echo "NPM Forward Hostname should remain: speechinsight-api (port 8080)."
            echo "Legacy container name speechinsight2 is retired; do not point NPM at it."
