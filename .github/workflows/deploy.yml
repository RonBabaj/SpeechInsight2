name: Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-speechinsight2-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy SpeechInsight2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          command_timeout: 25m
          script: |
            set -euo pipefail

            cd /opt/apps/SpeechInsight2

            git fetch origin
            git reset --hard origin/main

            docker compose down
            docker compose build --pull
            docker compose up -d

            docker image prune -f

            echo "Waiting for containers..."
            docker compose ps

            echo "Verifying health endpoint..."
            healthy=0
            for i in $(seq 1 30); do
              if curl -fsS "http://127.0.0.1:8080/api/health" >/dev/null; then
                echo "Health check passed on attempt ${i}"
                healthy=1
                break
              fi
              echo "Attempt ${i}/30: not healthy yet, retrying in 2s..."
              sleep 2
            done

            if [ "${healthy}" -ne 1 ]; then
              echo "ERROR: /api/health did not become healthy in time"
              docker compose ps
              docker compose logs --tail=100 || true
              exit 1
            fi

            running="$(docker compose ps --status running --format '{{.Name}}')"
            if ! printf '%s\n' "${running}" | grep -qx 'speechinsight2'; then
              echo "ERROR: required container speechinsight2 is not running"
              docker compose ps
              exit 1
            fi

            echo "Deployment verified successfully."
            docker compose ps
