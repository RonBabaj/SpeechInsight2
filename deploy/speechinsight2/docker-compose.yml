# Optional local/alternate compose for the deploy/speechinsight2 tree.
# Production uses the repo-root docker-compose.yml at /opt/apps/SpeechInsight2.
#
# From repo root:
#   docker compose -f deploy/speechinsight2/docker-compose.yml up --build

name: speechinsight2-deploy-alt

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: speechinsight2:latest
    container_name: speechinsight-api
    ports:
      - "8080:8080"
    env_file:
      - ../../.env
    environment:
      PORT: "8080"
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
