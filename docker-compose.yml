# SpeechInsight2 — production Docker Compose (VPS + Nginx Proxy Manager)
# Deploy from repo root: /opt/apps/SpeechInsight2
#
# Required on the host (gitignored): .env with at least OPENAI_API_KEY=...
# Optional overrides: ASPNETCORE_ENVIRONMENT, PORT

name: speechinsight2

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: speechinsight2:latest
    container_name: speechinsight2
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      PORT: "8080"
      ASPNETCORE_ENVIRONMENT: Production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 40s
